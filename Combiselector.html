 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowers Collage</title>
    <link rel="stylesheet" href="style.css">
    <style>*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
    url("https://media.istockphoto.com/id/1381637603/photo/mountain-landscape.jpg?s=612x612&w=0&k=20&c=w64j3fW8C96CfYo3kbi386rs_sHH_6BGe8lAAAFS-y4=")
    center/cover no-repeat;
}

.child{
    position:absolute;
    overflow:hidden;
    cursor:pointer;
    border-radius:12px;
    box-shadow:15px 15px 20px rgba(0,0,0,.6);
    transition:transform .35s ease, box-shadow .35s ease;
}

.child img{
    position:absolute;
    width:141%;
    height:141%;
    object-fit:cover;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) rotate(-45deg);
}

/* Centered Diamond Cards */

.child1{
    width:12vw;
    height:25vh;
    background:#232439;
    transform:rotate(45deg);
    top:80px;
    left:50%;
    margin-left:160px;
}

.child2{
    width:12vw;
    height:25vh;
    background:#36347c;
    transform:rotate(45deg);
    top:80px;
    left:50%;
    margin-left:-240px;
}

.child3{
    width:19vw;
    height:40vh;
    background:#05071e;
    transform:rotate(45deg);
    top:210px;
    left:50%;
    margin-left:-95px;
}

.child4{
    width:12vw;
    height:25vh;
    background:#a9a999;
    transform:rotate(45deg);
    top:450px;
    left:50%;
    margin-left:-240px;
}

.child5{
    width:12vw;
    height:25vh;
    background:#da90d7;
    transform:rotate(45deg);
    top:470px;
    left:50%;
    margin-left:160px;
}

/* Hero Text */

.hero-text{
    position:absolute;
    left:80px;
    top:45%;
    transform:translateY(-50%);
    width:40%;
    color:white;
    z-index:10;
}

.hero-text h1{
    margin:0;
    font-size:60px;
    font-weight:1000;
    text-transform:uppercase;
}

.hero-text h2{
    margin:10px 0;
    font-size:60px;
    color:#e62429;
    text-transform:uppercase;
}</style>
</head>
<body>
<div class="child child1">
    <img src="https://thumbs.dreamstime.com/b/beautiful-amazing-cosmos-flower-field-landscape-sunset-nature-wallpaper-background-179698760.jpg">
</div>

<div class="child child2">
    <img src="https://www.shutterstock.com/blog/wp-content/uploads/sites/5/2019/07/f2-16.jpg">
</div>

<div class="child child3">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRIu-skvmI2bVKhLKnxvjaybkr2Xw_0A0ngO8L4PHAbbTMGl-Mg13GnkzI&s=10">
</div>

<div class="child child4">
    <img src="https://static.vecteezy.com/system/resources/thumbnails/054/790/137/small/vibrant-spring-meadow-with-colorful-flowers-and-rolling-green-hills-showcasing-nature-beauty-and-tranquility-photo.jpeg">
</div>

<div class="child child5">
    <img src="https://cdn.mos.cms.futurecdn.net/KpoHBb7NNtP276b5dhCPWK.jpg">
</div>
</body>
</html>
